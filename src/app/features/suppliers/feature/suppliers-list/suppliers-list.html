<div class="suppliers-list p-4">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2 class="text-2xl font-bold m-0">Proveedores</h2>
    <p-button
      label="Nuevo Proveedor"
      icon="pi pi-plus"
      (onClick)="onNew()"
    />
  </div>

  @if (store.error()) {
    <div class="p-3 mb-3 border-round bg-red-100 text-red-700">
      {{ store.error() }}
    </div>
  }

  <p-table
    [value]="store.suppliers()"
    [loading]="store.loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} proveedores"
    [globalFilterFields]="['razonSocial', 'ruc', 'email']"
    styleClass="p-datatable-sm"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Razón Social</th>
        <th>RUC</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th>Estado</th>
        <th class="text-center" style="width: 200px;">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-supplier>
      <tr>
        <td>{{ supplier.razonSocial }}</td>
        <td>{{ supplier.ruc }}</td>
        <td>{{ supplier.email }}</td>
        <td>{{ supplier.telefono }}</td>
        <td>
          <p-tag
            [value]="supplier.activo ? 'Activo' : 'Inactivo'"
            [severity]="supplier.activo ? 'success' : 'danger'"
          />
        </td>
        <td class="text-center">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            (onClick)="onView(supplier.id)"
            pTooltip="Ver detalle"
          />
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            (onClick)="onEdit(supplier.id)"
            pTooltip="Editar"
            class="ml-2"
          />
          @if (supplier.activo) {
            <p-button
              icon="pi pi-ban"
              severity="danger"
              [text]="true"
              [rounded]="true"
              (onClick)="onDeactivate(supplier)"
              pTooltip="Desactivar"
              class="ml-2"
            />
          }
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center p-4 text-gray-500">
          No hay proveedores registrados
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-confirmDialog />
