<div class="register-form">
  <h2>Crear Cuenta</h2>

  @if (error()) {
    <div class="error-message">
      <i class="pi pi-exclamation-circle"></i>
      <span>{{ error() }}</span>
    </div>
  }

  <form (ngSubmit)="onSubmit()" #form="ngForm">
    <div class="field">
      <label for="name">Nombre completo</label>
      <input
        id="name"
        type="text"
        [ngModel]="name()" (ngModelChange)="name.set($event)"
        name="name"
        placeholder="Juan Pérez"
        required
      />
    </div>

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        [ngModel]="email()" (ngModelChange)="email.set($event)"
        name="email"
        placeholder="correo@ejemplo.com"
        required
        autocomplete="email"
      />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        [ngModel]="password()" (ngModelChange)="password.set($event)"
        name="password"
        placeholder="••••••••"
        required
        autocomplete="new-password"
      />
    </div>

    <div class="field">
      <label for="confirmPassword">Confirmar contraseña</label>
      <input
        id="confirmPassword"
        type="password"
        [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)"
        name="confirmPassword"
        placeholder="••••••••"
        required
        autocomplete="new-password"
      />
      @if (confirmPassword() && password() !== confirmPassword()) {
        <small class="field-error">Las contraseñas no coinciden</small>
      }
    </div>

    <button type="submit" class="btn-primary" [disabled]="loading() || !form.valid">
      @if (loading()) {
        <i class="pi pi-spin pi-spinner"></i>
        <span>Registrando...</span>
      } @else {
        <span>Registrarse</span>
      }
    </button>
  </form>

  <p class="login-link">
    ¿Ya tienes cuenta?
    <a routerLink="/auth/login">Inicia sesión</a>
  </p>
</div>
