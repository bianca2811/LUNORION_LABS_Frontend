// V1
<!-- *** V3 *** // Estructura Corregida para la Barra de Filtros Generalizada -->
<div class="filter-bar-container">
  
  <!-- Caja de Búsqueda de Texto con Lupa -->
  <div class="input-wrapper search-box">
    <span class="input-icon">
      <svg xmlns="http://w3.org" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </span>
    <input 
      type="text" 
      [(ngModel)]="filterValues.text" 
      (keyup.enter)="applyFilters()"
      [placeholder]="textPlaceholder">
  </div>

  <!-- Selector Desplegable de Estados -->
  <div class="input-wrapper select-box">
    <select [(ngModel)]="filterValues.status" (change)="applyFilters()">
      <option value="">Estado</option>
      @for (option of statusOptions; track option) {
        <option [value]="option.toLowerCase()">{{ option }}</option>
      }
    </select>
  </div>

  <!-- Campo de Selección de Fecha (Calendario) -->
  <div class="input-wrapper date-box">
    <input type="date" [(ngModel)]="filterValues.date" (change)="applyFilters()">
  </div>

  <!-- Acciones de Filtrado -->
  <div class="filter-actions-layout">
    
    <button type="button" class="btn-submit-filter" (click)="applyFilters()">
      <svg xmlns="http://w3.org" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
      Filtrar
    </button>

    <!-- 🛠️ Opción dinámica para deshacer filtros seleccionados -->
    <button 
      type="button" 
      class="btn-undo-filter" 
      *ngIf="hasActiveFilters()" 
      (click)="clearFilters()"
      title="Eliminar filtros aplicados">
      <svg xmlns="http://w3.org" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <polyline points="3 3 3 8 8 8"></polyline>
      </svg>
      Deshacer filtros
    </button>

  </div>

</div>
